<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div class="logo-text">Pulse <span>Protection</span></div>
      </div>
      <div class="sidebar-role">Logged in as <span>{{ getRoleLabel() }}</span></div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>

      <button class="nav-item active">
        <span class="nav-icon">▣</span> Dashboard
      </button>

      <ng-container *ngIf="isUser()">
        <button class="nav-item" (click)="goTo('/my-tickets')">
          <span class="nav-icon">T</span> My Ticket
        </button>
        <button class="nav-item" (click)="goTo('/new-ticket')">
          <span class="nav-icon">+</span> New Ticket
        </button>
      </ng-container>

      <ng-container *ngIf="isITAssistant()">
        <button class="nav-item" (click)="goTo('/ticket-queue')">
          <span class="nav-icon">Q</span> Ticket Queue
        </button>
        <button class="nav-item">
          <span class="nav-icon">A</span> My Assigned Tickets
        </button>
      </ng-container>

      <ng-container *ngIf="isAdmin()">
        <button class="nav-item">
          <span class="nav-icon">U</span> Manage Accounts
        </button>
        <button class="nav-item" (click)="goTo('/all-tickets')">
          <span class="nav-icon">T</span> All Tickets
        </button>
        <button class="nav-item">
          <span class="nav-icon">+</span> Create IT Assistant
        </button>
      </ng-container>

      <div class="nav-section-label">Account</div>
      <button class="nav-item">
        <span class="nav-icon">⚙</span> Settings
      </button>
    </nav>

    <div class="sidebar-foot">
      <button class="user-chip logout-button" type="button" (click)="logout()">
        <div class="user-avatar">{{ username.charAt(0).toUpperCase() }}</div>
        <div>
          <div class="user-name">{{ username }}</div>
          <div class="user-role-tag">{{ getRoleLabel() }}</div>
        </div>
        <span style="margin-left:auto;font-size:11px;color:var(--text3);">⏻</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">Dashboard Overview</div>
      <div class="topbar-right">
        <div class="status-pill">
          <div class="dot dot-green"></div>
          All Systems Operational
        </div>
      </div>
    </div>

    <div class="page-body">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val">12</div>
          <div class="stat-lbl">Total Tickets</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">2</div>
          <div class="stat-lbl">Active Now</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">10</div>
          <div class="stat-lbl">Resolved</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">98%</div>
          <div class="stat-lbl">Satisfaction</div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-card-head">
          <div class="table-card-title">Recent Tickets <span>{{ getRoleLabel() }} view</span></div>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="tid">TKT-0001</td>
              <td>VPN Connection Issues</td>
              <td><span class="badge badge-active">Active</span></td>
              <td>2026-03-20</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
