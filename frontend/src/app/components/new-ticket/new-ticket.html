<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div class="logo-text">Pulse <span>Protection</span></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <button class="nav-item" (click)="goBack()">
        <span class="nav-icon">📊</span> Dashboard
      </button>
      <button class="nav-item active">
        <span class="nav-icon">➕</span> New Ticket
      </button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">Create New Ticket</div>
    </div>

    <div class="page-body">
      <div class="table-card" style="max-width: 600px;">
        <div class="table-card-head">
          <div class="table-card-title">Submit a Ticket</div>
        </div>

        <div style="padding: 24px;">
          <div *ngIf="errorMessage" style="color: red; margin-bottom: 12px;">
            {{ errorMessage }}
          </div>
          <div *ngIf="successMessage" style="color: green; margin-bottom: 12px;">
            {{ successMessage }}
          </div>

          <div style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom: 6px;">Subject</label>
            <input
              [(ngModel)]="subject"
              type="text"
              placeholder="Brief description of the issue"
              style="width:100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1a1a2e; color: white;"
            />
          </div>

          <div style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom: 6px;">Description</label>
            <textarea
              [(ngModel)]="description"
              placeholder="Detailed description of the issue"
              rows="5"
              style="width:100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #1a1a2e; color: white;"
            ></textarea>
          </div>

          <button
            (click)="submitTicket()"
            [disabled]="isLoading"
            style="padding: 10px 24px; background: #00d4ff; color: black; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
            {{ isLoading ? 'Submitting...' : 'Submit Ticket' }}
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
