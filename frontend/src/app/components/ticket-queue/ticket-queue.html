<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div class="logo-text">Pulse <span>Protection</span></div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main Menu</div>
      <button class="nav-item" (click)="goBack()">
        <span class="nav-icon">📊</span> Dashboard
      </button>
      <button class="nav-item active">
        <span class="nav-icon">📋</span> Ticket Queue
      </button>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">Open Ticket Queue</div>
    </div>

    <div class="page-body">
      <div class="table-card">
        <div class="table-card-head">
          <div class="table-card-title">Available Tickets <span>Pick up a ticket to start working on it</span></div>
        </div>

        <div *ngIf="isLoading" style="padding: 24px;">Loading tickets...</div>
        <div *ngIf="errorMessage" style="padding: 24px; color: red;">{{ errorMessage }}</div>

        <table *ngIf="!isLoading">
          <thead>
            <tr>
              <th>ID</th>
              <th>Subject</th>
              <th>Status</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let ticket of tickets">
              <td class="tid">{{ ticket._id }}</td>
              <td>{{ ticket.subject }}</td>
              <td><span class="badge badge-active">{{ ticket.status }}</span></td>
              <td>{{ ticket.createdAt | date }}</td>
              <td>
                <button
                  (click)="pickUpTicket(ticket._id)"
                  style="padding: 6px 14px; background: #00d4ff; color: black; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                  Pick Up
                </button>
              </td>
            </tr>
            <tr *ngIf="tickets.length === 0">
              <td colspan="5" style="text-align:center; padding: 24px;">No open tickets available.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
